<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; script-src 'self' file: blob:; style-src 'unsafe-inline' file:;"
    />
    <link rel="stylesheet" href="../../components/base.css" />
    <link rel="stylesheet" href="./render-config.css" />
  </head>
  <body>
    <div id="container">
      <div class="field">
        <span class="label">output</span>
        <div class="path-row">
          <input id="output-input" type="text" spellcheck="false" />
          <button id="browse-btn">…</button>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <span class="label">width</span>
          <input id="width-input" type="number" min="1" />
        </div>
        <div class="field">
          <span class="label">height</span>
          <input id="height-input" type="number" min="1" />
        </div>
        <div class="field">
          <span class="label">fps</span>
          <input id="fps-input" type="number" min="1" max="120" value="60" />
        </div>
      </div>
      <div class="field-row field-row-2">
        <div class="field">
          <span class="label">skip</span>
          <input
            id="skip-input"
            type="text"
            placeholder="[[HH:]MM:]SS"
            spellcheck="false"
          />
        </div>
        <div class="field">
          <span class="label">length</span>
          <input
            id="length-input"
            type="text"
            placeholder="[[HH:]MM:]SS"
            spellcheck="false"
          />
        </div>
      </div>
      <div class="field">
        <span class="label">ffmpeg extra args</span>
        <textarea id="ffmpeg-extra" spellcheck="false"></textarea>
      </div>
    </div>

    <div id="actions">
      <button id="cancel-btn">Cancel</button>
      <button id="render-btn">
        <span class="action-icon">
          <svg><use href="#rec" /></svg>
        </span>
        Render
      </button>
    </div>

    <svg
      id="icon-container"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 0 0"
      width="0"
      height="0"
      style="display: none"
    >
      <defs>
        <symbol
          id="rec"
          viewBox="0 0 6.35 6.35"
          version="1.1"
          xmlns="http://www.w3.org/2000/symbol"
        >
          <circle
            fill="currentColor"
            stroke-width="0.264583"
            cx="3.175"
            cy="3.175"
            r="2.1166666"
          />
        </symbol>
      </defs>
    </svg>

    <script type="module" src="./render-config.js"></script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; script-src 'self' file: blob:; style-src 'unsafe-inline' file:; img-src 'self' file: data:;"
    />
    <link rel="stylesheet" href="../../components/base.css" />
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <div id="app-layout">
      <div id="tab-bar" class="tab-bar" style="display: none">
        <button class="tab-btn active" data-tab="params">Params</button>
        <button class="tab-btn" data-tab="gallery">Gallery</button>
      </div>
      <div id="params-panel" class="panel">
        <div id="settings" class="settings-container"></div>
        <div class="settings-actions">
          <button class="action-btn" data-action="load">
            <span class="action-icon"
              ><svg><use href="#load" /></svg
            ></span>
            Load
          </button>
          <button class="action-btn" data-action="save">
            <span class="action-icon"
              ><svg><use href="#save" /></svg
            ></span>
            Save
          </button>
          <button class="action-btn" data-action="render">
            <span class="action-icon"
              ><svg><use href="#rec" /></svg
            ></span>
            Render
          </button>
        </div>
      </div>
      <div id="gallery-panel" class="panel" style="display: none"></div>
    </div>

            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"

          xmlns="http://www.w3.org/2000/symbol"

    <script type="module" src="./settings.js"></script>

</html>

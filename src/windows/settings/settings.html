<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; script-src 'self' file: blob:; style-src 'unsafe-inline' file:; img-src 'self' file: data:;"
    />
    <link rel="stylesheet" href="../../components/base.css" />
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <div id="app-layout">
      <div id="panes-container">
        <div id="params-panel" class="panel">
          <div id="settings" class="settings-container"></div>
        </div>
        <div id="rendering-panel" class="panel">
          <div id="gui" class="gui-container"></div>
          <div id="rendering" class="rendering-container"></div>
        </div>
      </div>
      <div class="settings-actions">
        <button class="btn" data-action="load">
          <span class="action-icon">
            <svg><use href="#load" /></svg>
          </span>
          Load
        </button>
        <button class="btn" data-action="save">
          <span class="action-icon"
            ><svg><use href="#save" /></svg
          ></span>
          Save
        </button>
        <button class="btn" data-action="render">
          <span class="action-icon"
            ><svg><use href="#rec" /></svg
          ></span>
          Render
        </button>
      </div>
    </div>

    <script src="../../components/icons.js"></script>

    <script type="module" src="./settings.js"></script>
  </body>
</html>

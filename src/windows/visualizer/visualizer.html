<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; script-src 'self' file: blob:; style-src 'unsafe-inline' file:; worker-src blob:; media-src *"
    />

    <link rel="stylesheet" href="../../components/base.css" />

    <script src="./worklet-patch.js"></script>
    <script src="../../../node_modules/p5/lib/p5.js"></script>
    <script src="../../../node_modules/p5/lib/addons/p5.sound.js"></script>
  </head>
  <body>
    <div id="engine" class="engine"></div>

    <div id="controls" class="controls" style="display: none">
      <div data-vol>
        <div class="vol-widget"><div class="vol-cover"></div></div>
      </div>

      <div data-play>
        <svg><use href="#play" /></svg>
      </div>
      <div data-pause>
        <svg><use href="#pause" /></svg>
      </div>

      <div data-mic-on>
        <svg><use href="#mic" /></svg>
      </div>
      <div data-mic-off>
        <svg><use href="#mic-off" /></svg>
      </div>

      <div data-input-switch></div>

      <div data-bar></div>

      <div data-filename></div>
      <div data-track-length></div>

      <div data-loop>
        <svg><use href="#loop" /></svg>
      </div>

      <div data-fullscreen>
        <svg><use href="#fullscreen" /></svg>
      </div>
      <div data-windowed>
        <svg><use href="#windowed" /></svg>
      </div>

      <div data-param>
        <svg><use href="#param" /></svg>
      </div>

      <div data-gallery>
        <svg><use href="#gallery" /></svg>
      </div>

      <div data-sketch>SKETCH</div>
    </div>

    <div id="osd" class="osd hidden" data-osd data-hover>
      <div data-osd-vol>
        <div class="vol-widget"><div class="vol-cover"></div></div>
      </div>
      <div data-osd-seek></div>
      <div data-osd-icon>
        <svg><use href="#play" /></svg>
      </div>
      <div data-osd-size></div>
    </div>

    <div class="size-corner" data-size-corner></div>

    <div id="error-bar" class="error-bar"></div>

    <div id="loader" class="loader"></div>

    <script src="../../components/icons.js"></script>

    <script type="module" src="./visualizer.js"></script>
  </body>
</html>
